
# ====================================================================
# Master Initialization
# ====================================================================

- name: Run kubeadm init
  become: true
  ansible.builtin.command: kubeadm init --apiserver-advertise-address {{ ansible_host }} --pod-network-cidr "10.244.0.0/16" --upload-certs
  register: kubeadm_init_output
  changed_when: "'Your Kubernetes control-plane has initialized successfully' in kubeadm_init_output.stdout"

- name: kubeadm initalization
  debug:
    msg: "{{ kubeadm_init_output }}"

# ====================================================================
# K8s Configuration
# ====================================================================

- name: Create .kube directory in k8s user's home
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Copy kubeconfig from local files to k8s user's home
  ansible.builtin.copy:
    src: "/etc/kubernetes/admin.conf"
    dest: "/home/{{ ansible_user }}/.kube/config"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
    remote_src: yes

# ====================================================================
#  Container Network Interface (CNI)
# ====================================================================

- name: Install Calico network plugin
  ansible.builtin.command:
    cmd: kubectl apply -f https://docs.projectcalico.org/manifests/calico.yaml
  environment:
    KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"

# ====================================================================
# Install Helm
# ====================================================================

- name: Download Helm installation script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    dest: /tmp/get-helm-3
    mode: '0755'

- name: Install Helm using the downloaded script
  ansible.builtin.shell: '/tmp/get-helm-3'
  become: true

# ====================================================================
#  Join worker nodes command
# ====================================================================

- name: Get join command
  become: true
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_command_output
  changed_when: true

- name: Join command
  debug:
    msg: "{{ join_command_output }}"

- name: Set join command as fact
  ansible.builtin.set_fact:
    kube_join_command: "{{ join_command_output.stdout }}"
    cacheable: true