apiVersion: v1
kind: Namespace
metadata:
  # name required by kustomize to parse; overridden by kustomization namespace:
  name: placeholder
  labels:

    # ================================================
    # Pod Security Admission (PSA)
    # ================================================
    
    # Values: privileged, baseline, or restricted
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: v1.37

    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/audit-version: v1.37

    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: v1.37