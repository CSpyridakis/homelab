apiVersion: v1
kind: PersistentVolume
metadata:
  name: frigate-config-pv
  namespace: applications # TODO: Check if this is the proper ns
spec:
  capacity:
    storage: 1Gi
  accessModes:
  - ReadWriteOnce
  storageClassName: manual
  # FIXME: Make this more rubust
  hostPath:
    path: /data/frigate/config
