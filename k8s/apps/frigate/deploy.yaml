apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: frigate
  name: frigate
spec:
  # =========================================================
  # Deployment specific
  # =========================================================
  replicas: 1
  selector:
    matchLabels:
      app: frigate
  strategy: {}

  # =========================================================
  # Template
  # =========================================================
  template:
    metadata:
      labels:
        app: frigate
    spec:

      # -----------------------------------
      # Init Containers
      # -----------------------------------
      # Containers
      initContainers:
      - name: initiliazation
        image: busybox
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            drop: ["ALL"]
        args:
        - sh
        - -c
        - cp -f /config-ro/config.yaml /config-rw/
        volumeMounts:
        - name: frigate-config-ro
          mountPath: "/config-ro"
        - name: frigate-config-rw
          mountPath: "/config-rw"
    
      # -----------------------------------
      # Containers
      # -----------------------------------
      containers:
      - name: frigate
        image: ghcr.io/blakeblackshear/frigate:0.17.2 
        securityContext:
          # For this case, due to: /package/admin/s6-overlay/libexec/preinit: 
          # fatal: /run belongs to uid 0 instead of 1000, has insecure and/or 
          # unworkable permissions, and we're lacking the privileges to fix it.
          # Is required for now
          allowPrivilegeEscalation: true
        # Ports
        ports:
        - containerPort: 1883
        - containerPort: 5000
        # Secret values
        envFrom:
        - secretRef:
            name: frigate-secrets
        # Configuration  
        volumeMounts:
        - name: frigate-media
          mountPath: /media/frigate
        - name: frigate-config-rw
          mountPath: "/config"
        # Resources
        resources:
          limits:
            cpu: "2500m"
            memory: "3Gi"

      # --------------------------------
      # Volumes
      # --------------------------------
      volumes:
      # Media/data: persisted on the data PVC
      - name: frigate-media
        persistentVolumeClaim:
          claimName: frigate-data
      # Read-only initial config from the config map
      - name: frigate-config-ro
        configMap:
          name: frigate-config
      # Writable config: persisted on the config PVC
      # (init container seeds config.yaml into it from the config map)
      - name: frigate-config-rw
        persistentVolumeClaim:
          claimName: frigate-config
