apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: privileged-apps

# =========================================================
# Resources
# =========================================================

resources:
- service.yaml
- pv-config.yaml
- pv-data.yaml
- pvc-config.yaml
- pvc-data.yaml
- deploy.yaml

# =========================================================
# Configs
# =========================================================

configMapGenerator:
- name: frigate-config
  files:
  - config.yaml=config/config.yaml
  options:
    disableNameSuffixHash: true

# =========================================================
# Secrets
# =========================================================

secretGenerator:
- name: frigate-secrets
  envs:
  - config/.env
  options:
    disableNameSuffixHash: true